# PR 與 main 的檢查（DS4）：format → lint → typecheck → test（含 DB 整合測試）→ 覆蓋率門檻。
# 整合測試使用 PostgreSQL 16 service（與 docker-compose 相同版本）；pg_trgm 由 migration 0000 建立。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同一分支有新 push 時取消舊的檢查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aeh
          POSTGRES_PASSWORD: aeh
          POSTGRES_DB: anime_event_hub_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aeh -d anime_event_hub_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TZ: Asia/Taipei
      # 設定後整合測試才會執行（未設定時會略過，CI 不允許略過）；worker 測試會另建 *_worker_test
      DATABASE_URL_TEST: postgres://aeh:aeh@localhost:5433/anime_event_hub_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 版本取自 package.json 的 packageManager

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 格式
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: 型別檢查
        run: pnpm typecheck

      - name: 測試
        run: pnpm test

      - name: 覆蓋率門檻（normalize / tagger / dedup / notify ≥ 80%）
        run: pnpm coverage
